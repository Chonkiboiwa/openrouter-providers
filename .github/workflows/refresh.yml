name: Refresh data + deploy

# Every 15 min: OpenRouter pricing / providers / AI benchmarks (fetch_data.py).
# Daily 03:30 UTC: also scrape fresh LMArena ranks (fetch_arena.js).
# Manual (workflow_dispatch) runs both, same as the daily run.
on:
  schedule:
    - cron: "*/15 * * * *"  # every 15 minutes
    - cron: "30 3 * * *"    # daily 03:30 UTC — + arena ranks
  workflow_dispatch: {}     # manual "Run workflow" button runs everything

permissions:
  contents: write   # to commit refreshed data + deploy to the gh-pages branch

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install node deps (playwright-core, used by the arena scrape)
        run: npm ci

      - name: Install Chromium for the arena scrape (daily / manual only)
        if: github.event.schedule == '30 3 * * *' || github.event_name == 'workflow_dispatch'
        run: npx --yes playwright@1.62.1 install --with-deps chromium

      - name: Fetch OpenRouter pricing + providers + AI benchmarks
        run: python scripts/fetch_data.py

      - name: Scrape LMArena ranks (daily 03:30 / manual only)
        if: github.event.schedule == '30 3 * * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true   # never block the deploy on the enrichment scrape
        run: node scripts/fetch_arena.js

      - name: Commit refreshed arena ranks (persists for 15-min builds)
        if: github.event.schedule == '30 3 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/arena_raw.json
          git diff --cached --quiet || git commit -m "chore: refresh LMArena ranks [skip ci]"
          git push

      - name: Cache-bust assets with the commit SHA
        run: |
          SHA=$(git rev-parse --short HEAD)
          sed -i "s|href=\"style.css\"|href=\"style.css?v=$SHA\"|" public/index.html
          sed -i "s|src=\"app.js\"|src=\"app.js?v=$SHA\"|" public/index.html

      - name: Deploy site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          publish_branch: gh-pages
